name: SWAT Guardian Intelligence CI

on:
  push:
    branches:
      - feature/context-guardian-v0.4-intelligence
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r control_center/requirements.txt httpx
      - name: Existing Guardian and intelligence regression tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('control_center/static/intelligence.html').read_text(encoding='utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/swat-intelligence.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/swat-intelligence.js
